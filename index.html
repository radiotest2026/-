        function formatEnglishTime(date) {
            let hours = date.getHours();
            const minutes = date.getMinutes();
            const ampm = hours >= 12 ? 'م' : 'ص';
            hours = hours % 12;
            hours = hours ? hours : 12;
            const minutesStr = minutes < 10 ? '0' + minutes : minutes;
            return `${hours}:${minutesStr} ${ampm}`;
        }
        
        function formatEnglishDate(date) {
            const days = ['الأحد', 'الإثنين', 'الثلاثاء', 'الأربعاء', 'الخميس', 'الجمعة', 'السبت'];
            const months = ['يناير', 'فبراير', 'مارس', 'أبريل', 'مايو', 'يونيو', 'يوليو', 'أغسطس', 'سبتمبر', 'أكتوبر', 'نوفمبر', 'ديسمبر'];
            const dayName = days[date.getDay()];
            const dayNum = date.getDate();
            const monthName = months[date.getMonth()];
            const year = date.getFullYear();
            
            const engDayNum = String(dayNum).replace(/[٠-٩]/g, d => "٠١٢٣٤٥٦٧٨٩".indexOf(d));
            const engYear = String(year).replace(/[٠-٩]/g, d => "٠١٢٣٤٥٦٧٨٩".indexOf(d));
            
            return `${dayName} ${engDayNum} ${monthName} ${engYear}`;
        }

            const [currentIndex, setCurrentIndex] = useState(0);
            const [zoomedImage, setZoomedImage] = useState(null);
            
            const [currentPrayerImg, setCurrentPrayerImg] = useState('https://iili.io/Cr5uOkQ.md.png');
            const [currentWeatherImg, setCurrentWeatherImg] = useState('https://iili.io/Cr5lGqB.md.png');
            const [pType, setPType] = useState('url');
            const [wType, setWType] = useState('url');
            const [customDate, setCustomDate] = useState('');

            const autoDate = formatEnglishDate(new Date());

            const [clickCount, setClickCount] = useState(0);
            const [showPasswordModal, setShowPasswordModal] = useState(false);

            const [wImgInput, setWImgInput] = useState('https://iili.io/Cr5lGqB.md.png');
            const [dateInput, setDateInput] = useState('');

            useEffect(() => {
                const unsubscribe = db.collection("settings").doc("rotator_images").onSnapshot(doc => {
                    if (doc.exists) {
                        const data = doc.data();
                        if (data.prayerImage) {
                            setCurrentPrayerImg(data.prayerImage);
                            setPImgInput(data.prayerImage);
                            setPType(data.prayerType || 'url');
                        }
                        if (data.weatherImage) {
                            setCurrentWeatherImg(data.weatherImage);
                            setWImgInput(data.weatherImage);
                            setWType(data.weatherType || 'url');
                        }
                        if (data.customDate !== undefined) {
                            setCustomDate(data.customDate);
                            setDateInput(data.customDate);
                        }
                    }
                });
                return () => unsubscribe();
            }, []);

            const handleHeaderClick = () => {
                const next = clickCount + 1;
                if (next >= 5) {
                    setShowPasswordModal(true);
                    setClickCount(0);
                } else {
                    setClickCount(next);
                }
            };

            const handleLogin = (e) => {
                e.preventDefault();
                if (passwordInput === '108') {
                    setShowPasswordModal(false);
                    setShowImagePanel(true);
                    setPasswordInput('');
                } else {
                    alert('كلمة المرور غير صحيحة!');
                }
            };

                e.preventDefault();
                try {
                    await db.collection("settings").doc("rotator_images").set({

                        weatherImage: wImgInput || 'https://iili.io/Cr5lGqB.md.png',

                        customDate: dateInput,

        function Slider({ items }) {

            const prevSlide = (e) => { if(e) e.stopPropagation(); setIndex((prev) => (prev - 1 + items.length) % items.length); };
            useEffect(() => {

        function App() {
            const [showAll, setShowAll] = useState(false);
            const [darkMode, setDarkMode] = useState(false);
            const [openingNews, setOpeningNews] = useState(null);
            const [countdown, setCountdown] = useState(1);

            const [sliderItems, setSliderItems] = useState([]);
            const [listItems, setListItems] = useState([]);
            const [cloudNews, setCloudNews] = useState([]);
            
            const [cloudLiveProgram, setCloudLiveProgram] = useState({
                programName: 'صباحكم رياضة',
                presenterName: 'مع الإعلامية: نجلاء حلمي'
            });

            const fetchData = () => {
                db.collection("news").orderBy("createdAt", "desc").get().then((querySnapshot) => {
                    let cloudList = [];
                    let cloudSlider = [];
                    let adminCloudList = [];
                    querySnapshot.forEach((doc) => {
                        const item = { firebaseId: doc.id, ...doc.data() };
                        if (item.time) {
                            item.time = item.time.replace(/[٠-٩]/g, d => "٠١٢٣٤٥٦٧٨٩".indexOf(d));
                        }
                        adminCloudList.push(item);
                        cloudList.push(item);
                        if (item.inSlider) {
                            cloudSlider.push(item);
                        }
                    });
                    setCloudNews(adminCloudList);
                    
                    const finalList = cloudList.length > 0 ? [...cloudList, ...initialListNews] : initialListNews;
                    setListItems(finalList);

                    const finalSlider = cloudSlider.length > 0 ? [...cloudSlider, ...initialSliderNews].slice(0, 5) : initialSliderNews;
                    setSliderItems(finalSlider);
                }).catch((error) => {
                    console.log("Error getting news: ", error);
                    setListItems(initialListNews);
                    setSliderItems(initialSliderNews);
                });

                db.collection("settings").doc("live_program").get().then((doc) => {
                    if (doc.exists) {
                        const data = doc.data();
                        setCloudLiveProgram({
                            programName: data.programName || 'صباحكم رياضة',
                            presenterName: data.presenterName || 'مع الإعلامية: نجلاء حلمي'
                        });
                    }
                }).catch((error) => {
                    console.log("Error getting live program settings: ", error);
                });
            };

            useEffect(() => {
                fetchData();
            }, []);

            // منع ظهور رسالة التحميل عند الضغط على زر الرجوع في المتصفح أو الموبايل
            useEffect(() => {
                const handlePageShow = (event) => {
                    if (event.persisted) {
                        setOpeningNews(null);
                    }
                };
                window.addEventListener('pageshow', handlePageShow);
                return () => window.removeEventListener('pageshow', handlePageShow);
            }, []);

            // سرعة فائقة جداً (أقل من ثانية) للانتقال للخبر
            useEffect(() => {
                if (!openingNews) return;
                if (countdown > 0) {
                    const timer = setTimeout(() => {
                        setCountdown(prev => prev - 1);
                    }, 400);
                    return () => clearTimeout(timer);
                } else {
                    window.open(openingNews.link, '_self');
                }
            }, [openingNews, countdown]);

            useEffect(() => {
                const handleOpenWithLoading = (e) => {
                    const news = e.detail;
                    if (news && news.link) {
                        setOpeningNews(news);
                        setCountdown(1);
                    }
                };
                window.addEventListener('openNewsWithLoading', handleOpenWithLoading);
                return () => window.removeEventListener('openNewsWithLoading', handleOpenWithLoading);
            }, []);

            const [headerClickCount, setHeaderClickCount] = useState(0);
            const [showPasswordModal, setShowPasswordModal] = useState(false);
            const [passwordInput, setPasswordInput] = useState('');
            const [showAdminPanel, setShowAdminPanel] = useState(false);

            const [newTitle, setNewTitle] = useState('');
