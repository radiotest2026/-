        function App() {
            const [showAll, setShowAll] = useState(false);
            const [activeModalUrl, setActiveModalUrl] = useState(null);
            const [showNav, setShowNav] = useState(true);
            const [darkMode, setDarkMode] = useState(false);

            const [sliderItems, setSliderItems] = useState(initialSliderNews);
            const [listItems, setListItems] = useState(initialListNews);
            const [cloudNews, setCloudNews] = useState([]);

            const fetchCloudNews = () => {
                db.collection("news").orderBy("createdAt", "desc").get().then((querySnapshot) => {
                    let cloudList = [];
                    let cloudSlider = [];
                    let adminCloudList = [];
                    querySnapshot.forEach((doc) => {
                        const item = { firebaseId: doc.id, ...doc.data() };
                        adminCloudList.push(item);
                        cloudList.push(item);
                        if (item.inSlider) {
                            cloudSlider.push(item);
                        }
                    });
                    setCloudNews(adminCloudList);
                    if (cloudList.length > 0) {
                        setListItems([...cloudList, ...initialListNews]);
                    }
                    const combinedSlider = [...cloudSlider, ...initialSliderNews].slice(0, 5);
                    setSliderItems(combinedSlider);
                }).catch((error) => {
                    console.log("Error getting documents: ", error);
                });
            };

            useEffect(() => {
                fetchCloudNews();
            }, []);

            const [clickCount, setClickCount] = useState(0);
            const [showPasswordModal, setShowPasswordModal] = useState(false);
            const [passwordInput, setPasswordInput] = useState('');
            const [showAdminPanel, setShowAdminPanel] = useState(false);

            const [newTitle, setNewTitle] = useState('');
            const [newImage, setNewImage] = useState('');
            const [newLink, setNewLink] = useState('');
            const [newProgram, setNewProgram] = useState('');
            const [newPlacement, setNewPlacement] = useState('both');
            const [editingId, setEditingId] = useState(null);

            const handleHeaderClick = () => {
                setClickCount(prev => {
                    const next = prev + 1;
                    if (next >= 5) {
                        setShowPasswordModal(true);
                        return 0;
                    }
                    return next;
                });
            };

            const handleLogin = (e) => {
                e.preventDefault();
                if (passwordInput === '108') {
                    setShowPasswordModal(false);
                    setShowAdminPanel(true);
                    setPasswordInput('');
                } else {
                    alert('كلمة المرور غير صحيحة!');
                }
            };

            const handleSaveNews = async (e) => {
                e.preventDefault();
                if (!newTitle || !newLink) {
                    alert('يرجى إدخال عنوان الخبر ورابط الخبر على الأقل!');
                    return;
                }

                const now = new Date();
                const datePart = now.toLocaleDateString('ar-EG', { day: 'numeric', month: 'long', year: 'numeric' });
                const timePart = now.toLocaleTimeString('ar-EG', { hour: '2-digit', minute: '2-digit', hour12: true }).replace('AM', 'ص').replace('PM', 'م');
                const timeNow = `${datePart} - ${timePart}`;

                const newsObj = {
                    title: newTitle,
                    program: newProgram || "إذاعة الشباب والرياضة",
                    image: newImage || "https://iili.io/CgzIo9S.md.png",
                    time: timeNow,
                    link: newLink,
                    inSlider: newPlacement === 'both',
                    createdAt: firebase.firestore.FieldValue.serverTimestamp()
                };

                try {
                    if (editingId) {
                        await db.collection("news").doc(editingId).update(newsObj);
                        alert('تم تحديث وتعديل الخبر بنجاح في السحاب!');
                        setEditingId(null);
                    } else {
                        newsObj.id = Date.now();
                        await db.collection("news").add(newsObj);
                        alert('تم نشر الخبر بنجاح في السحاب وسيراه جميع الزوار فوراً!');
                    }

                    fetchCloudNews();
                    setNewTitle('');
                    setNewImage('');
                    setNewLink('');
                    setNewProgram('');
                    setNewPlacement('both');
                } catch (error) {
                    alert('حدث خطأ أثناء الحفظ السحابي: ' + error.message);
                }
            };

            const handleEditClick = (item) => {
                setEditingId(item.firebaseId);
                setNewTitle(item.title);
                setNewImage(item.image);
                setNewLink(item.link);
                setNewProgram(item.program || '');
                setNewPlacement(item.inSlider ? 'both' : 'list_only');
            };

            const handleDeleteNews = async (firebaseId) => {
                if (confirm("هل أنت متأكد من حذف هذا الخبر نهائياً من الموقع والسحاب؟")) {
                    try {
                        await db.collection("news").doc(firebaseId).delete();
                        if (editingId === firebaseId) {
                            setEditingId(null);
                            setNewTitle('');
                            setNewImage('');
                            setNewLink('');
                            setNewProgram('');
                        }
                        fetchCloudNews();
                        alert("تم حذف الخبر بنجاح!");
                    } catch (error) {
                        alert("حدث خطأ أثناء الحذف: " + error.message);
                    }
                }
            };

            useEffect(() => {
                if (activeModalUrl) {
                    setShowNav(true);
                    return;
                }
                const handleScroll = () => {
                    const scrollY = window.scrollY;
